# Builds the web app image (Dockerfile: Flutter web build served by nginx)
# and publishes it to GitHub Container Registry, so Unraid (or any Docker
# host) pulls a ready image instead of compiling Flutter itself.
#
#   ghcr.io/<owner>/opennutritracker:latest   newest main
#   ghcr.io/<owner>/opennutritracker:sha-xxxxxxx
#
# Build-time values come from repository secrets (the same ones the app
# reads through envied): SUPABASE_BACKUP_URL / SUPABASE_BACKUP_ANON_KEY for
# cloud backup and sync, and optionally FDC_API_KEY (generic-food search)
# and SENTRY_DNS. Missing optional secrets just disable that feature.
name: Docker image

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'fonts/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'Dockerfile'
      - 'nginx.default.conf'
      - 'nginx.app.conf'
      - 'nginx.off-image-cache.conf'
      - 'docker/**'
      - 'photos-service/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennutritracker
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # Build once into the local daemon and try it before publishing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: opennutritracker:test
          build-args: |
            GIT_SHA=${{ github.sha }}
            FDC_API_KEY=${{ secrets.FDC_API_KEY }}
            SENTRY_DNS=${{ secrets.SENTRY_DNS }}
            BACKUP_SUPABASE_PROJECT_URL=${{ secrets.SUPABASE_BACKUP_URL }}
            BACKUP_SUPABASE_PROJECT_ANON_KEY=${{ secrets.SUPABASE_BACKUP_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (HTTP 80, HTTPS 443 with generated cert)
        run: |
          docker run -d --name ont -p 8080:80 -p 8443:443 opennutritracker:test
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q flutter_bootstrap.js
          curl -fsS -o /dev/null http://localhost:8080/flutter_bootstrap.js
          curl -fsSk https://localhost:8443/ | grep -q flutter_bootstrap.js
          curl -fsSk -o /dev/null https://localhost:8443/main.dart.js
          docker logs ont 2>&1 | grep -q "generated a self-signed certificate"
          # The app shell must revalidate on every load (no content hashes).
          curl -fsSI http://localhost:8080/main.dart.js | grep -i '^cache-control: no-cache'
          curl -fsSI http://localhost:8080/flutter_bootstrap.js | grep -i '^cache-control: no-cache'
          # Photo proxy. Open Food Facts' image host can be very slow, so this
          # only warns when it does not answer; the proxy route itself must
          # exist (nginx answers 404 for an unknown path, never for a proxied one
          # unless upstream does, so a status other than 000 means it is wired).
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60             http://localhost:8080/off-images/images/products/301/762/042/2003/front_en.1.100.jpg || true)
          echo "off-images proxy status: $code"
          case "$code" in
            200|404) ;;
            *) echo "::warning::off-images proxy returned $code (OFF slow or unreachable)" ;;
          esac
          # Photo service (photos-service/) behind nginx. CI has no real
          # Supabase token, so this checks that requests without one are
          # refused on both ports, and that the service comes back after it
          # dies (docker/50-ont-photos.sh restarts it).
          trap 'echo "--- container log ---"; docker logs ont 2>&1 | tail -40' ERR
          photos_status() { curl -sk -o /dev/null -w '%{http_code}' "$@" || true; }
          echo "photos-api status: $(photos_status http://localhost:8080/photos-api/)"
          for i in $(seq 1 20); do [ "$(photos_status http://localhost:8080/photos-api/)" = 401 ] && break; sleep 1; done
          test "$(photos_status http://localhost:8080/photos-api/)" = 401
          test "$(photos_status http://localhost:8080/photos-api/v1/)" = 401
          test "$(photos_status https://localhost:8443/photos-api/v1/)" = 401
          test "$(photos_status -X PUT --data x http://localhost:8080/photos-api/v1/$(printf '%064d' 0))" = 401
          # grep -q on a pipe would SIGPIPE docker logs and fail under pipefail.
          docker logs ont > ont.log 2>&1; grep -q "listening on 127.0.0.1:8081" ont.log
          echo "photo service log line found; killing it"
          # By /proc rather than pkill, which the image's busybox may lack.
          docker exec ont sh -c 'for p in /proc/[0-9]*; do [ "$(cat "$p/comm" 2>/dev/null)" = ont-photos ] && kill "${p#/proc/}"; done; true'
          sleep 1
          for i in $(seq 1 20); do [ "$(photos_status http://localhost:8080/photos-api/)" = 401 ] && break; sleep 1; done
          test "$(photos_status http://localhost:8080/photos-api/)" = 401
          docker logs ont > ont.log 2>&1; grep -q "photo service stopped; restarting" ont.log
          # nginx still serves the app.
          curl -fsS http://localhost:8080/ | grep -q flutter_bootstrap.js
          curl -fsSk https://localhost:8443/ | grep -q flutter_bootstrap.js
          docker rm -f ont

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            FDC_API_KEY=${{ secrets.FDC_API_KEY }}
            SENTRY_DNS=${{ secrets.SENTRY_DNS }}
            BACKUP_SUPABASE_PROJECT_URL=${{ secrets.SUPABASE_BACKUP_URL }}
            BACKUP_SUPABASE_PROJECT_ANON_KEY=${{ secrets.SUPABASE_BACKUP_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
