# Supabase pauses free-plan projects after 7 days without activity, which
# breaks accounts, sync and reminders until someone restores the project by
# hand. One tiny REST read a day counts as activity and keeps it up.
#
# The request uses the public anon/publishable key to read the public
# sign-ups switch (app_settings); it writes nothing.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_BACKUP_URL       https://<ref>.supabase.co
#   SUPABASE_BACKUP_ANON_KEY  the anon / sb_publishable_ key (never the secret key)
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query app_settings
        env:
          URL: ${{ secrets.SUPABASE_BACKUP_URL }}
          KEY: ${{ secrets.SUPABASE_BACKUP_ANON_KEY }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 \
            "$URL/rest/v1/app_settings?select=signups_open" \
            -H "apikey: $KEY")
          echo "HTTP $status"
          test "$status" = "200"
