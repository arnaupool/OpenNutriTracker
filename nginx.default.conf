# Replaces nginx:alpine's stock /etc/nginx/conf.d/default.conf. The base
# image ships with gzip off, so the compiled JS/Wasm bundle (several MB)
# was going out over the wire uncompressed — real cost on a home upload
# connection. Cache-Control is deliberately conservative (short-lived,
# not "immutable") because Flutter's web build output isn't
# content-hashed (main.dart.js keeps its name across releases) — an
# aggressive cache would hide new deploys behind the browser's HTTP
# cache instead of just the app's own service-worker versioning.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        font/woff2
        image/svg+xml;

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Explicit MIME type: not every nginx build's bundled mime.types maps
    # .wasm to application/wasm, and without it browsers can't use
    # WebAssembly.instantiateStreaming (the fast compile path) — CanvasKit
    # ships as .wasm even on the default JS compile target.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    # Open Food Facts' Search-a-licious service (used for in-app text
    # search) doesn't send Access-Control-Allow-Origin, so a browser blocks
    # it outright even though the service itself is healthy. Proxied
    # same-origin so the browser only ever talks to this domain; native
    # builds aren't subject to CORS and call the upstream host directly
    # (see OFFConst.getOffWordSearchUrl).
    location /off-search-proxy/ {
        proxy_pass https://search.openfoodfacts.org/;
        proxy_set_header Host search.openfoodfacts.org;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
