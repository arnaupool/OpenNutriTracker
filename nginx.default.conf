# On-disk cache for Open Food Facts product photos (see /off-images/ in
# nginx.app.conf). Lives inside the container; mount a volume at
# /var/cache/nginx/off-images to keep it across updates.
proxy_cache_path /var/cache/nginx/off-images levels=1:2 keys_zone=off_images:20m
                 max_size=1g inactive=60d use_temp_path=off;

# Replaces nginx:alpine's stock /etc/nginx/conf.d/default.conf. The base
# image ships with gzip off, so the compiled JS/Wasm bundle (several MB)
# was going out over the wire uncompressed — real cost on a home upload
# connection. The app shell is served with "no-cache" (revalidate on every
# load) because Flutter's web build output isn't content-hashed
# (main.dart.js keeps its name across releases); see nginx.app.conf.

server {
    listen 80;
    include /etc/nginx/ont/app.conf;
}

# HTTPS for opening the app directly at https://<host>:<port>. Browsers
# only expose the Web Crypto API the app uses to encrypt its local data in
# a secure context (HTTPS or localhost), so plain http://<lan-ip> shows a
# blank page. The certificate is self-signed and generated on first start
# (docker/40-ont-self-signed-cert.sh) unless one is mounted at /certs.
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    include /etc/nginx/ont/app.conf;
}
