# Shared by both server blocks in nginx.default.conf (plain HTTP on 80 for a
# reverse proxy, HTTPS on 443 for direct LAN access).

server_name _;
root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/wasm
    font/woff2
    image/svg+xml;

# Flutter web file names are not content-hashed (main.dart.js,
# flutter_bootstrap.js, flutter.js, version.json, manifest.json, the
# AssetManifest/FontManifest json keep their names across releases), so the
# app shell must revalidate on every load. "no-cache" still lets the browser
# keep a copy: it sends If-None-Match and gets a cheap 304 when nothing
# changed, but picks up a new release on the next load instead of up to an
# hour later.
location ~* \.(?:js|css|json)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Explicit MIME type: not every nginx build's bundled mime.types maps
# .wasm to application/wasm, and without it browsers can't use
# WebAssembly.instantiateStreaming (the fast compile path) -- CanvasKit
# ships as .wasm even on the default JS compile target.
location ~* \.wasm$ {
    default_type application/wasm;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# CanvasKit is large and only changes with the Flutter engine, so it may be
# cached for a day. A prefix match with ^~ wins over the regex locations
# above.
location ^~ /canvaskit/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}

location ~* \.(?:png|jpg|jpeg|gif|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache";
}

# Web push worker for the reminders (scope /push/).
location = /push_sw.js {
    add_header Cache-Control "no-cache";
}

# Open Food Facts' Search-a-licious service (used for in-app text
# search) doesn't send Access-Control-Allow-Origin, so a browser blocks
# it outright even though the service itself is healthy. Proxied
# same-origin so the browser only ever talks to this domain; native
# builds aren't subject to CORS and call the upstream host directly
# (see OFFConst.getOffWordSearchUrl).
location /off-search-proxy/ {
    proxy_pass https://off_search_upstream/;
    proxy_set_header Host search.openfoodfacts.org;
    proxy_ssl_server_name on;
    proxy_ssl_name search.openfoodfacts.org;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# Open Food Facts product photos. images.openfoodfacts.org takes 13 to 25 s
# to first byte per thumbnail, and on web the app has no persistent disk
# cache, so every session would wait again. The web build requests them
# same-origin through here (lib/core/utils/off_image_url.dart) and nginx
# keeps them on disk (proxy_cache_path in nginx.default.conf). Image URLs
# carry the revision number (.../front_en.12.400.jpg), so a cached copy never
# goes stale and the browser may keep it for a year.
location ^~ /off-images/ {
    proxy_pass https://off_images_upstream/;
    include /etc/nginx/ont/off-image-cache.conf;
    proxy_ssl_name images.openfoodfacts.org;
    proxy_set_header Host images.openfoodfacts.org;
}

# Same for static.openfoodfacts.org (icons, Nutri-Score and similar assets).
location ^~ /off-static/ {
    proxy_pass https://off_static_upstream/;
    include /etc/nginx/ont/off-image-cache.conf;
    proxy_ssl_name static.openfoodfacts.org;
    proxy_set_header Host static.openfoodfacts.org;
}

location / {
    try_files $uri $uri/ =404;
}
