services:
  app:
    build:
      context: .
      args:
        FDC_API_KEY: ${FDC_API_KEY}
        SENTRY_DNS: ${SENTRY_DNS}
        BACKUP_SUPABASE_PROJECT_URL: ${BACKUP_SUPABASE_PROJECT_URL}
        BACKUP_SUPABASE_PROJECT_ANON_KEY: ${BACKUP_SUPABASE_PROJECT_ANON_KEY}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
